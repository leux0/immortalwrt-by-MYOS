name: Build C2000MAX firmware

# 放在 C2000MAX 分支的 .github/workflows/c2000max.yml
# 手动触发；可自选配置模式、额外软件包、要移除的软件包。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "源码分支"
        required: true
        default: C2000MAX
        type: string
      mode:
        description: "配置模式：lean=只用设备默认包；full=用仓库自带 .config"
        required: true
        default: lean
        type: choice
        options:
          - lean
          - full
      packages:
        description: "额外启用的软件包，空格或逗号分隔（例：luci-app-ttyd luci-app-quickfile）"
        required: false
        default: ""
        type: string
      remove_packages:
        description: "要移除的软件包，空格或逗号分隔（例：luci-app-store kmod-fs-btrfs）"
        required: false
        default: ""
        type: string
      extra_config:
        description: "额外 CONFIG 项，分号分隔（例：CONFIG_TARGET_ROOTFS_PARTSIZE=200;CONFIG_PACKAGE_luci-app-ttyd=y）"
        required: false
        default: ""
        type: string
      version:
        description: "版本号，例如 V3.1.42；留空则用仓库默认"
        required: false
        default: ""
        type: string

concurrency:
  group: c2000max-${{ github.ref }}-${{ github.event.inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE: nradio_c2000-max

jobs:
  build:
    name: Build C2000MAX (${{ inputs.mode }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git rsync swig unzip \
            zlib1g-dev file wget curl ccache subversion device-tree-compiler python3 \
            python3-pyelftools python3-ply python3-docutils python3-setuptools libelf-dev \
            ecj fastjar java-propose-classpath libc6-dev-i386 libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libreadline-dev libssl-dev libncurses5-dev \
            libncursesw5-dev uglifyjs libyaml-dev msmtp texinfo xmlto qemu-utils genisoimage \
            help2man ninja-build p7zip-full ca-certificates squashfs-tools
          ccache --version
          ccache -M "${CCACHE_MAXSIZE}"

      - name: Restore dl cache
        id: restore-dl-cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-dl-${{ inputs.branch }}-
            ${{ runner.os }}-dl-

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-c2000max-ccache-${{ inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-c2000max-ccache-${{ inputs.branch }}-
            ${{ runner.os }}-c2000max-ccache-

      - name: Update and install feeds
        shell: bash
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch libffi feed for runner build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          path = Path('feeds/packages/libs/libffi/Makefile')
          if not path.is_file():
              print('libffi Makefile not found, skip')
              sys.exit(0)

          text = path.read_text()
          old = "\n".join([
              "\t$(CP) \\",
              "\t\t$(PKG_BUILD_DIR)/$(GNU_TARGET_NAME)*/fficonfig.h \\",
              "\t\t$(1)/usr/include/",
              "",
          ])
          new = "\n".join([
              "\tconf_h=''; \\",
              "\tfor p in \\",
              "\t\t$(PKG_BUILD_DIR)/$(GNU_TARGET_NAME)*/fficonfig.h \\",
              "\t\t$(PKG_BUILD_DIR)/*/fficonfig.h \\",
              "\t\t$(PKG_BUILD_DIR)/fficonfig.h; do \\",
              "\tcase \"$$$$p\" in \\",
              "\t\t*msvc_build*) continue ;; \\",
              "\tesac; \\",
              "\tif [ -f \"$$$$p\" ]; then \\",
              "\t\tconf_h=\"$$$$p\"; \\",
              "\t\tbreak; \\",
              "\tfi \\",
              "\tdone; \\",
              "\t[ -n \"$$$$conf_h\" ] && $(CP) \"$$$$conf_h\" $(1)/usr/include/",
              "",
          ])
          if old not in text:
              print('libffi patch context not found, skip')
              sys.exit(0)
          path.write_text(text.replace(old, new, 1))
          print('libffi patched')
          PY

      - name: Check private binary input
        shell: bash
        run: |
          id_rsa="target/linux/mediatek/image/nradio-c2000-max/myos-remote-files/usr/share/myos-nros/id_rsa.db"
          if [ ! -f "$id_rsa" ]; then
            echo "::warning title=Missing id_rsa.db::公开仓库没有 APP 云鉴权凭据，APP 远程功能将不可用；不影响编译。"
          fi

      - name: Prepare config
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          EXTRA_PACKAGES: ${{ inputs.packages }}
          REMOVE_PACKAGES: ${{ inputs.remove_packages }}
          EXTRA_CONFIG: ${{ inputs.extra_config }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # 镜像装配阶段的“强制注入”列表会要求每个 ipk 都已编出。
          # lean 模式清空它，让最终的包集合完全由 .config 决定。
          trim_extra() {
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('target/linux/mediatek/image/filogic.mk')
          text = path.read_text()
          new, count = re.subn(
              r'C2000MAX_EXTRA_IPK_PACKAGES\s*:=.*?(?=C2000MAX_REMOVE_IPK_PACKAGES)',
              'C2000MAX_EXTRA_IPK_PACKAGES :=\n\n',
              text,
              flags=re.S,
          )
          if count:
              path.write_text(new)
          print('trimmed extra ipk list entries:', count)
          PY
          }

          if [ "$MODE" = "lean" ]; then
            trim_extra
            printf '%s\n' \
              'CONFIG_TARGET_mediatek=y' \
              'CONFIG_TARGET_mediatek_filogic=y' \
              'CONFIG_TARGET_mediatek_filogic_DEVICE_nradio_c2000-max=y' \
              'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
              'CONFIG_TARGET_ROOTFS_PARTSIZE=200' \
              'CONFIG_TARGET_ROOTFS_INITRAMFS=y' \
              'CONFIG_TARGET_INITRAMFS_COMPRESSION_XZ=y' \
              'CONFIG_TARGET_ROOTFS_INITRAMFS_SEPARATE=y' \
              'CONFIG_CCACHE=y' > .config
          else
            if [ ! -f .config ]; then
              echo "仓库里没有 .config，无法使用 full 模式" >&2
              exit 1
            fi
            echo "使用仓库自带 .config"
            if [ -n "$REMOVE_PACKAGES" ]; then
              trim_extra
              echo "::warning title=Extra list cleared::full 模式下移除了包，已清空强制注入列表以避免装配缺 IPK"
            fi
          fi

          # 先移除，再追加，最后 defconfig 统一解析依赖。
          for pkg in $(printf '%s' "$REMOVE_PACKAGES" | tr ',' ' '); do
            [ -n "$pkg" ] || continue
            ./scripts/config -d "CONFIG_PACKAGE_${pkg}" || true
          done

          for pkg in $(printf '%s' "$EXTRA_PACKAGES" | tr ',' ' '); do
            [ -n "$pkg" ] || continue
            printf 'CONFIG_PACKAGE_%s=y\n' "$pkg" >> .config
          done

          if [ -n "$EXTRA_CONFIG" ]; then
            printf '%s\n' "$EXTRA_CONFIG" | tr ';' '\n' >> .config
          fi

          ./scripts/config -e CONFIG_CCACHE

          if [ -n "$VERSION" ]; then
            ./scripts/config --set-str CONFIG_VERSION_NUMBER "$VERSION" || true
          fi

          make defconfig

          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_nradio_c2000-max=y' .config || {
            echo "错误：nradio_c2000-max 没有被选中，请确认 branch 输入是 C2000MAX" >&2
            exit 1
          }

          # 提示哪些额外包没能启用（包名错误或与依赖冲突）。
          for pkg in $(printf '%s' "$EXTRA_PACKAGES" | tr ',' ' '); do
            [ -n "$pkg" ] || continue
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "::warning title=Package not enabled::${pkg} 没有出现在 .config 中，请检查包名或依赖"
            fi
          done

          # 被 DEVICE_PACKAGES / 默认集强制选中的包，defconfig 会重新打开。
          for pkg in $(printf '%s' "$REMOVE_PACKAGES" | tr ',' ' '); do
            [ -n "$pkg" ] || continue
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "::warning title=Package kept::${pkg} 仍被设备默认集选中，未能移除"
            fi
          done

          echo "==== 目标 ===="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' .config || true
          echo "==== rootfs 分区大小 ===="
          grep -E '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config || true
          echo "==== 已选包数量 ===="
          grep -c '^CONFIG_PACKAGE_.*=y' .config || true
          echo "==== 版本 ===="
          grep -E '^CONFIG_VERSION_NUMBER=' .config || true

      - name: Download sources
        shell: bash
        run: |
          set -euxo pipefail
          make download -j"$(nproc)"

      - name: Bootstrap host ninja
        shell: bash
        run: |
          set -euxo pipefail
          make tools/ninja/compile -j1 V=s
          [ -x staging_dir/host/bin/ninja ]
          staging_dir/host/bin/ninja --version

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          ccache -z
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          ccache -s | tee ccache.log

      - name: Collect firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          shopt -s nullglob
          images=(bin/targets/${TARGET}/${SUBTARGET}/*nradio_c2000-max*)
          if [ ${#images[@]} -eq 0 ]; then
            echo "没有找到 nradio_c2000-max 固件" >&2
            ls -lh "bin/targets/${TARGET}/${SUBTARGET}" || true
            exit 1
          fi
          cp -v "${images[@]}" artifact/
          cp -v .config artifact/config-C2000MAX.txt
          cp -v "bin/targets/${TARGET}/${SUBTARGET}/profiles.json" artifact/ 2>/dev/null || true
          cp -v "bin/targets/${TARGET}/${SUBTARGET}/sha256sums" artifact/ 2>/dev/null || true
          (cd artifact && sha256sum * > SHA256SUMS)
          ls -lh artifact

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-C2000MAX-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: artifact/*

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-C2000MAX-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build.log
            ccache.log
            .config
            bin/targets/mediatek/filogic/*.manifest

      - name: Save dl cache
        if: always() && steps.restore-dl-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.restore-dl-cache.outputs.cache-primary-key }}

      - name: Save ccache
        if: always() && steps.restore-ccache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}
